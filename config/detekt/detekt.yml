# Cabin detekt config: detekt defaults plus Compose-aware adjustments.
# Rationale: docs/quality.md. Existing findings: <module>/detekt-baseline.xml.

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongParameterList:
    # Composables take many optional, defaulted parameters by design.
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInObjects: 25
    ignorePrivate: true

naming:
  FunctionNaming:
    # Composables are PascalCase by Compose API guidelines.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    # Layout values live in CabinKitMetrics / tokens; composables still need small literals.
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    excludes: ['**/test/**', '**/*Metrics.kt', '**/CabinIcons.kt', '**/*Samples.kt']
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3
  WildcardImport:
    active: true
  ForbiddenComment:
    comments:
      - value: 'FIXME'
        reason: 'Fix before merging or file an issue.'
      - value: 'STOPSHIP'
        reason: 'Must be resolved before release.'

formatting:
  # ktlint rules via detekt-formatting. 'detekt --auto-correct' fixes most of these.
  MaximumLineLength:
    maxLineLength: 140
  FunctionNaming:
    active: false
  Filename:
    active: false
  NoWildcardImports:
    active: true
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
